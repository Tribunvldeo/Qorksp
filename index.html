<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>PLAY STREAM Premium</title>
<meta name="description" content="PLAY STREAM - Koleksi video pilihan dengan tampilan premium.">

<style>
:root{
  --bg:#080d18;
  --panel:#101a2b;
  --gold:#d6ad55;
  --gold2:#f5d98d;
  --text:#f5f5f5;
  --muted:#a7b0c0;
  --border:rgba(214,173,85,.25);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
header{
  background:linear-gradient(135deg,#101b30,#050810);
  border-bottom:1px solid var(--border);
  padding:18px 14px;
}
.header-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:43px;height:43px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--gold2),#9b7025);
  color:#111;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:900;
}
.brand h1{margin:0;font-size:21px;letter-spacing:1px}
.brand small{color:var(--gold);font-size:10px;letter-spacing:2px}
.header-label{
  color:var(--gold2);
  border:1px solid var(--border);
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
}
.container{
  max-width:1150px;
  margin:auto;
  padding:18px 14px 35px;
}

/* PLAYER DI ATAS */
.player-section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:20px;
  scroll-margin-top:10px;
}
.player-heading{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.player-heading h2{
  margin:0;
  font-size:16px;
  color:var(--gold2);
}
.player-heading span{font-size:10px;color:var(--muted)}
.player-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}
.player-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.action-btn{
  flex:1;
  min-width:100px;
  border:1px solid var(--border);
  background:#18243a;
  color:var(--gold2);
  padding:11px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}
.action-btn.primary{
  background:var(--gold);
  color:#111;
  font-weight:bold;
}
.notice{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  margin-top:12px;
}

/* HERO */
.hero{
  background:linear-gradient(120deg,#14233b,#0c1423 65%,#201a10);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px 18px;
  margin-bottom:20px;
}
.hero h2{margin:0 0 8px;font-size:23px;color:var(--gold2)}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:22px 0 13px;
}
.section-title h2{font-size:17px;margin:0}
.section-title span{color:var(--gold);font-size:11px}
.search-wrap{margin-bottom:13px}
.search-wrap input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px 14px;
  color:white;
  outline:none;
}
.search-wrap input:focus{border-color:var(--gold)}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:16px;
}
.tab{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-size:12px;
}
.tab.active{background:var(--gold);color:#15100a;font-weight:bold}

/* VIDEO GRID */
.video-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.video-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}
.video-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.thumb{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  background:#172235;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.3s;
}
.video-card:hover .thumb img{transform:scale(1.04)}
.play-icon{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.15);
}
.play-icon span{
  width:43px;height:43px;
  border-radius:50%;
  display:grid;
  place-items:center;
  padding-left:3px;
  background:rgba(214,173,85,.92);
  color:#111;
  font-size:19px;
}
.video-info{padding:10px}
.video-info h3{
  font-size:12px;
  line-height:1.45;
  margin:0 0 7px;
  min-height:35px;
}
.video-meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
}
.video-meta b{color:var(--gold)}
.empty{
  display:none;
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:22px 0;
  flex-wrap:wrap;
}
.page-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}
.page-btn.active{background:var(--gold);color:#111;font-weight:bold}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
footer{
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
  padding:22px 12px;
  font-size:11px;
  line-height:1.8;
  margin-top:30px;
}
footer strong{color:var(--gold)}

/* --- STYLING IN-PAGE PUSH (MENUTUPI VIDEO DI TENGAH) --- */
.inp-push-container {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(4, 8, 15, 0.85);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s ease-out forwards;
}

.inp-push-container.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.inp-push-box {
  background: linear-gradient(145deg, #17243a, #090e18);
  border: 1px solid var(--gold);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  cursor: pointer;
  animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes scaleUp {
  from { transform: scale(0.8);
